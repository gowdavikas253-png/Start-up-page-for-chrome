<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="NEON STARK x AUDI start page banner with four spinning wheel rings">
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#8d939c"/><stop offset=".55" stop-color="#eceef2"/><stop offset="1" stop-color="#666c75"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9dce2"/><stop offset="1" stop-color="#8e949d"/></linearGradient>
<radialGradient id="glow" cx="25%" cy="50%" r="70%"><stop offset="0" stop-color="#eb142d" stop-opacity=".38"/><stop offset="1" stop-color="#eb142d" stop-opacity="0"/></radialGradient>
<pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#0d0d0d"/><rect width="4" height="4" fill="#161616"/><rect x="4" y="4" width="4" height="4" fill="#161616"/></pattern>
<style>
.rim{fill:none;stroke:url(#chrome);stroke-width:14}
.disc{fill:rgba(235,20,45,.10)}
.tread{fill:none;stroke:rgba(235,20,45,.7);stroke-width:3;stroke-dasharray:2.4 2.8}
.wheel line{stroke:#eb142d;stroke-width:3.4;stroke-linecap:round}
.valve{fill:#fff}.hub{fill:none;stroke:url(#chrome);stroke-width:3}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.led{animation:sweep 3s linear infinite}
@keyframes sweep{from{transform:translateX(-360px)}to{transform:translateX(1280px)}}
.t1{font:800 46px 'Orbitron','Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:url(#title)}
.t2{font:600 22px 'Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#b4b8bf}
.t3{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:1px;fill:#eb142d}
</style>
</defs>
<rect width="1280" height="320" fill="url(#carbon)"/>
<rect width="1280" height="320" fill="url(#glow)"/>
<rect y="0" width="1280" height="3" fill="#eb142d"/>
<rect class="led" x="0" y="0" width="360" height="3" fill="#ffffff" opacity=".85"/>
<g transform="translate(60 58) scale(1.62)"><g><circle class="rim" cx="75" cy="65" r="50"/><g class="wheel"><circle class="disc" cx="75" cy="65" r="34"/><circle class="tread" cx="75" cy="65" r="36"/><line x1="75.0" y1="57.0" x2="75.0" y2="32.0"/><line x1="81.9" y1="61.0" x2="103.6" y2="48.5"/><line x1="81.9" y1="69.0" x2="103.6" y2="81.5"/><line x1="75.0" y1="73.0" x2="75.0" y2="98.0"/><line x1="68.1" y1="69.0" x2="46.4" y2="81.5"/><line x1="68.1" y1="61.0" x2="46.4" y2="48.5"/><circle class="valve" cx="75" cy="35" r="3.8"/><circle class="hub" cx="75" cy="65" r="7"/></g></g><g><circle class="rim" cx="135" cy="65" r="50"/><g class="wheel"><circle class="disc" cx="135" cy="65" r="34"/><circle class="tread" cx="135" cy="65" r="36"/><line x1="135.0" y1="57.0" x2="135.0" y2="32.0"/><line x1="141.9" y1="61.0" x2="163.6" y2="48.5"/><line x1="141.9" y1="69.0" x2="163.6" y2="81.5"/><line x1="135.0" y1="73.0" x2="135.0" y2="98.0"/><line x1="128.1" y1="69.0" x2="106.4" y2="81.5"/><line x1="128.1" y1="61.0" x2="106.4" y2="48.5"/><circle class="valve" cx="135" cy="35" r="3.8"/><circle class="hub" cx="135" cy="65" r="7"/></g></g><g><circle class="rim" cx="195" cy="65" r="50"/><g class="wheel"><circle class="disc" cx="195" cy="65" r="34"/><circle class="tread" cx="195" cy="65" r="36"/><line x1="195.0" y1="57.0" x2="195.0" y2="32.0"/><line x1="201.9" y1="61.0" x2="223.6" y2="48.5"/><line x1="201.9" y1="69.0" x2="223.6" y2="81.5"/><line x1="195.0" y1="73.0" x2="195.0" y2="98.0"/><line x1="188.1" y1="69.0" x2="166.4" y2="81.5"/><line x1="188.1" y1="61.0" x2="166.4" y2="48.5"/><circle class="valve" cx="195" cy="35" r="3.8"/><circle class="hub" cx="195" cy="65" r="7"/></g></g><g><circle class="rim" cx="255" cy="65" r="50"/><g class="wheel"><circle class="disc" cx="255" cy="65" r="34"/><circle class="tread" cx="255" cy="65" r="36"/><line x1="255.0" y1="57.0" x2="255.0" y2="32.0"/><line x1="261.9" y1="61.0" x2="283.6" y2="48.5"/><line x1="261.9" y1="69.0" x2="283.6" y2="81.5"/><line x1="255.0" y1="73.0" x2="255.0" y2="98.0"/><line x1="248.1" y1="69.0" x2="226.4" y2="81.5"/><line x1="248.1" y1="61.0" x2="226.4" y2="48.5"/><circle class="valve" cx="255" cy="35" r="3.8"/><circle class="hub" cx="255" cy="65" r="7"/></g></g></g>
<text class="t1" x="640" y="150" textLength="590" lengthAdjust="spacingAndGlyphs">NEON STARK × AUDI</text>
